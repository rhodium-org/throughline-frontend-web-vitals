uid: SR-0005
type: system_requirement
status: approved
title: Measure vitals with real-user field data, not lab data alone
text: >-
  Base your Core Web Vitals assessment on real-user field data (such as the Chrome User
  Experience Report), because lab measurements cannot capture the range of devices,
  networks and interactions real users bring.
