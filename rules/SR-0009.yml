uid: SR-0009
type: system_requirement
status: approved
title: Never lazy-load the LCP image
text: >-
  Never apply loading="lazy" to the LCP image, because deferring its load always adds
  unnecessary resource load delay to the largest paint.
links:
- target: UR-0002
  type: implements
attrs:
  source_ref: "Google Web Vitals: Optimize LCP — Lazy Loading"
