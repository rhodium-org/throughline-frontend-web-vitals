uid: SR-0022
type: system_requirement
status: approved
title: Set explicit width and height on images and video
text: >-
  Always include width and height attributes on image and video elements, or reserve the
  space with CSS aspect-ratio, so the browser reserves the correct layout box before the
  media loads.
links:
