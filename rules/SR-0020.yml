uid: SR-0020
type: system_requirement
status: approved
title: Use content-visibility to defer offscreen rendering
text: >-
  Apply the CSS content-visibility property to lazily render offscreen elements as they
  approach the viewport, reducing rendering work during load and interactions.
links:
